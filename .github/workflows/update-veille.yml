name: Mettre à jour la veille
on:
  schedule:
    - cron: '18 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run veille:update
      - name: Enregistrer le cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/feed-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiser la veille RSS"
            git push
          fi
